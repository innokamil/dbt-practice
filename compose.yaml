services:
  app:
    build:
      context: ./airflow
      target: dev
    networks:
      - front-tier
      - back-tier
    ports:
      - 8080:8080
    depends_on:
      pagila-db:
        condition: service_healthy
      sakila-db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: .
          initial_sync: true
  pagila-db:
    image: postgres:17
    container_name: pagila
    networks:
      - back-tier
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "pagila"
    volumes:
      - pagila-data:/var/lib/postgresql/data
    expose:
      - 5432
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "sh -c pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 120s
      retries: 5
      start_period: 60s
  sakila-db:
    image: mysql:9.0
    container_name: sakila 
    networks:
      - back-tier
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "sakila"
    volumes:
      - sakila-data:/var/lib/mysql
    expose:
      - 3306
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
volumes:
  pagila-data: {}
  sakila-data: {}
networks:
  front-tier: {}
  back-tier: {}
